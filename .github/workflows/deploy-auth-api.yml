name: Deploy ACP auth-api

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type DEPLOY-AUTH-API to authorize deployment of auth-api"
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: acp-auth-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing auth-api to ACP Supabase
    runs-on: ubuntu-latest
    environment: acp-production
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_deployment == 'DEPLOY-AUTH-API' }}
    steps:
      - name: Checkout approved source commit
        uses: actions/checkout@v4
        with:
          ref: 30acda3b6549e1d834fe985806dce46e18415c49
          persist-credentials: false

      - name: Verify source commit and target project
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "30acda3b6549e1d834fe985806dce46e18415c49"
          test -f supabase/functions/auth-api/index.ts
          grep -q 'daily-reports/teams' supabase/functions/auth-api/index.ts
          grep -q 'daily-reports/snapshot' supabase/functions/auth-api/index.ts
          grep -q 'daily-reports/compare' supabase/functions/auth-api/index.ts
          grep -q 'daily-reports/generate' supabase/functions/auth-api/index.ts
          grep -q 'daily-reports/regenerate' supabase/functions/auth-api/index.ts
          grep -q 'verify_jwt = false' supabase/config.toml
          echo "Verified commit: $(git rev-parse HEAD)"
          echo "Target project: htviglbaacaqpojrnvko"
          echo "Target function: auth-api"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only auth-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase functions deploy auth-api --project-ref htviglbaacaqpojrnvko
